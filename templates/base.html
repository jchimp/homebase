<!DOCTYPE html>
<html lang="en"{% if mode and mode != 'system' %} data-mode="{{ mode }}"{% endif %}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ settings.title }}</title>
  {% if inline %}
  <style>{{ _theme_css | safe }}</style>
  <style>{{ _base_css | safe }}</style>
  {% else %}
  <link id="theme-css" rel="stylesheet" href="/static/css/themes/{{ theme }}.css">
  <script>
    (function () {
      var KNOWN = ['nord', 'slate', 'sage'];
      var LEGACY = { midnight: 'sage', light: 'sage' };
      var t = localStorage.getItem('homebase-theme');
      if (t && LEGACY[t]) { t = LEGACY[t]; localStorage.setItem('homebase-theme', t); }
      if (t && KNOWN.indexOf(t) !== -1) {
        document.getElementById('theme-css').href = '/static/css/themes/' + t + '.css';
      } else if (t) {
        localStorage.removeItem('homebase-theme');
      }
      var m = localStorage.getItem('homebase-mode');
      if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-mode', m);
    })();
  </script>
  <link rel="stylesheet" href="/static/css/base.css">
  {% endif %}
  {% if accent_css %}<style id="accent-override">{{ accent_css | safe }}</style>{% endif %}
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% if not inline %}
  <div class="dashboard-controls">
    {% if settings.show_theme_switcher %}
    <div class="theme-picker">
      <button class="theme-toggle" id="theme-switch" onclick="homebase.toggleThemeMenu()"
              aria-haspopup="true" aria-expanded="false" aria-label="Choose theme" title="Choose theme">🎨</button>
      <div class="theme-menu" id="theme-menu" role="menu" hidden></div>
    </div>
    {% endif %}
    <button class="theme-toggle" onclick="homebase.toggleMode()" aria-label="Toggle light/dark" title="Toggle light/dark">
      <span id="theme-toggle-icon">🌙</span>
    </button>
  </div>
  {% endif %}
  {% if inline %}
  <script>{{ _homebase_js | safe }}</script>
  {% else %}
  <script src="/static/js/homebase.js"></script>
  {% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
