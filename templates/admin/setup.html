<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup — Homebase</title>
  <link id="theme-css" rel="stylesheet" href="/static/css/themes/{{ theme }}.css">
  <script>
    (function () {
      var KNOWN = ['nord', 'slate', 'sage'];
      var LEGACY = { midnight: 'sage', light: 'sage' };
      var t = localStorage.getItem('homebase-theme');
      if (t && LEGACY[t]) { t = LEGACY[t]; localStorage.setItem('homebase-theme', t); }
      if (t && KNOWN.indexOf(t) !== -1) {
        document.getElementById('theme-css').href = '/static/css/themes/' + t + '.css';
      } else if (t) {
        localStorage.removeItem('homebase-theme');
      }
      var m = localStorage.getItem('homebase-mode');
      if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-mode', m);
    })();
  </script>
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1 class="login-card__title">Welcome to Homebase</h1>
    <p class="login-card__subtitle">Create your admin account to get started.</p>
    {% if error %}
    <div class="login-card__error">{{ error }}</div>
    {% endif %}
    <form action="/setup" method="post" class="login-form">
      <label class="form-label">
        Username
        <input class="form-input" type="text" name="username"
               value="{{ username or 'admin' }}" autocomplete="username" required autofocus>
      </label>
      <label class="form-label">
        Password
        <input class="form-input" type="password" name="password"
               autocomplete="new-password" minlength="8" required>
      </label>
      <label class="form-label">
        Confirm password
        <input class="form-input" type="password" name="confirm"
               autocomplete="new-password" minlength="8" required>
      </label>
      <button class="btn btn--primary" type="submit">Create account</button>
    </form>
  </div>
</body>
</html>
